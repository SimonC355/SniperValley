# Builds the Windows program (a zip with SniperValley.exe) for every pull request and every
# push to main; each run keeps the zip under Artifacts. A push to main whose package.json
# version has no release yet also publishes that release with the zip (title and notes from
# scripts/release-notes.mjs, which reads the version's section of CHANGELOG.md).
name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run exe

      - name: Zip the program
        shell: pwsh
        run: Compress-Archive -Path release/SniperValley-win32-x64/* -DestinationPath SniperValley-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          path: SniperValley-windows-x64.zip
          archive: false

      # every run shows the title and notes the release would get (so a pull request checks them)
      - name: Release notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "$(node -p "require('./package.json').version")"
          cat notes.md

      - name: Publish a release for a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released. Raise the version in package.json to publish a new release."
            exit 0
          fi
          # title and notes (with the version's section of CHANGELOG.md, if there is one)
          title=$(node scripts/release-notes.mjs "$version")
          gh release create "v$version" SniperValley-windows-x64.zip --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
